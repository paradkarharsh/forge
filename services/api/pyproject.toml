[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "forge-api"
version = "0.1.0"
description = "Forge backend service"
requires-python = ">=3.12"
dependencies = ["alembic>=1.16,<2.0","asyncpg>=0.30,<1.0","authlib>=1.6,<2.0","email-validator>=2.2,<3.0","fastapi>=0.116,<1.0","pwdlib[argon2]>=0.3,<1.0","PyJWT[crypto]>=2.10,<3.0","pydantic-settings>=2.10,<3.0","redis>=6.4,<7.0","sqlalchemy[asyncio]>=2.0,<3.0","uvicorn[standard]>=0.35,<1.0"]
[project.optional-dependencies]
dev = ["httpx>=0.28,<1.0","pytest>=8.4,<9.0","pytest-asyncio>=1.1,<2.0","ruff>=0.12,<1.0"]
[tool.hatch.build.targets.wheel]
packages = ["src/forge_api"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","UP","B"]
